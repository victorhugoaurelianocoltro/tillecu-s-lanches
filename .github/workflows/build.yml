name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Solo Node 22: camera-controls, que entra como dependencia de
# @react-three/drei, declara engines.node >= 22.0.0. En Node 20 la instalacion
# avisa (EBADENGINE) y la compilacion todavia sale, pero seria un verde que no
# significa nada.

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Instalar exactamente lo que fija el lockfile
        run: npm ci

      - name: Pruebas
        # Comprueban lo que el compilador no ve: rutas de assets,
        # variables de entorno documentadas, reglas de seguridad.
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Compilar
        env:
          GITHUB_PAGES: "true"
        run: npm run build

      - name: Comprobar que la compilacion ha producido algo
        run: |
          test -d dist || { echo "no hay carpeta dist"; exit 1; }
          test -f dist/index.html || { echo "dist sin index.html"; exit 1; }
          echo "dist: $(find dist -type f | wc -l) ficheros"

      - name: Configurar GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Publicar artefato do Pages
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Implantar GitHub Pages
        if: github.event_name != 'pull_request'
        id: deployment
        uses: actions/deploy-pages@v4
